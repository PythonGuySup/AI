
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      kafka-topics --create --if-not-exists --topic tasks --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1;
      "

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U todouser -d taskdb" ]
      interval: 10s
      timeout: 5s
      retries: 5


  mongodb:
    image: mongo:6
    command: mongod --quiet --logpath /dev/null
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: eventuser
      MONGO_INITDB_ROOT_PASSWORD: eventpass
      MONGO_INITDB_DATABASE: eventdb
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "none"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  task-service-1:
    build: ./todo-microservices/task-service
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=taskdb
      - POSTGRES_USER=todouser
      - POSTGRES_PASSWORD=todopass
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/tasks" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres
      - redis

  task-service-2:
    build: ./todo-microservices/task-service
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=taskdb
      - POSTGRES_USER=todouser
      - POSTGRES_PASSWORD=todopass
    depends_on:
      - postgres
      - redis

  event-service:
    build: ./todo-microservices/event-service
    environment:
      - MONGO_HOST=mongodb
      - KAFKA_HOST=kafka
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
    restart: unless-stopped

  # notification-service
  notification-service:
    build: ./todo-microservices/notification-service
    environment:
      - KAFKA_HOST=kafka
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./agent
    ports:
      - "8500:8500"
      - "9000:9000"
    environment:
      - TASK_SERVICE_URL=http://task-service-1:8001
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./agent/chroma_db:/app/chroma_db
    depends_on:
      redis:
        condition: service_started
      task-service-1:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  ollama_data: