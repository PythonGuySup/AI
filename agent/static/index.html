<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant ToDo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* главная карточка чата — как в todo */
        .chat-card {
            background: #111;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a1a24;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            color: #f0a3cf;
            margin-bottom: 1.8rem;
            letter-spacing: -0.3px;
            text-shadow: 0 0 6px rgba(218, 48, 128, 0.4);
        }

        /* область сообщений */
        .chat-messages {
            height: 480px;
            overflow-y: auto;
            padding: 1.5rem;
            background: #0a0809;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        /* сообщения */
        .message {
            display: flex;
            gap: 0.7rem;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 0.7rem 1.2rem;
            border-radius: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: #da307e;
            color: #0b0b0b;
            font-weight: 500;
            border-bottom-right-radius: 0.3rem;
        }

        .message.assistant .bubble {
            background: #1c1519;
            color: #f2e0ec;
            border: 1px solid #2e1f28;
            border-bottom-left-radius: 0.3rem;
        }

        /* поле ввода */
        .input-area {
            display: flex;
            padding: 1.2rem;
            background: #0e0c0d;
            gap: 0.8rem;
            border-top: 1px solid #2a1a24;
        }

        .input-area input {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #2c2428;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            color: #f0e6ec;
            transition: 0.2s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #e6398b;
            box-shadow: 0 0 0 2px rgba(230, 57, 139, 0.2);
        }

        .input-area input::placeholder {
            color: #6a5a62;
        }

        .input-area button {
            background: #da307e;
            border: none;
            padding: 0 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #0b0b0b;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .input-area button:hover {
            background: #f04b96;
            transform: translateY(-1px);
        }

        .input-area button:active {
            transform: translateY(1px);
        }

        /* индикатор загрузки */
        .loading-bubble {
            background: #1c1519;
            border: 1px solid #2e1f28;
            padding: 0.6rem 1.2rem;
            border-radius: 1.5rem;
            color: #c595b2;
            font-style: italic;
            font-size: 0.85rem;
            display: inline-block;
        }

        /* скролл */
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #1a1217;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #da307e;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✦ AI ASSISTANT ✦</h1>
    <div class="chat-card">
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="bubble">Привет! Я помогу тебе с задачами. Напиши, что нужно сделать ✨</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="например: создай задачу купить молоко" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');

    function addMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        messageDiv.appendChild(bubble);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addLoadingMessage() {
        const id = 'loading-' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.id = id;
        loadingDiv.className = 'message assistant';
        loadingDiv.innerHTML = `<div class="loading-bubble">печатает...</div>`;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return id;
    }

    function removeLoadingMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    async function sendMessage() {
        const query = userInput.value.trim();
        if (!query) return;

        addMessage('user', query);
        userInput.value = '';

        const loadingId = addLoadingMessage();

        try {
            const response = await fetch(`/ask?q=${encodeURIComponent(query)}`);
            if (!response.ok) throw new Error('Ошибка сервера');
            const data = await response.json();
            removeLoadingMessage(loadingId);
            addMessage('assistant', data.answer || 'Не удалось получить ответ');
        } catch (error) {
            removeLoadingMessage(loadingId);
            addMessage('assistant', '⚠️ Ошибка соединения с агентом. Попробуйте позже.');
            console.error(error);
        }
    }

    // делаем функцию глобальной для onclick
    window.sendMessage = sendMessage;
</script>
</body>
</html>
